name: ALOOKHOR source artifact preflight

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful push build run ID from private alookhor-store
        required: true
        type: string
      source_sha:
        description: Exact 40-character source commit SHA
        required: true
        type: string
      confirm_sha:
        description: Re-enter the same 40-character SHA to confirm
        required: true
        type: string

permissions:
  contents: none

concurrency:
  group: alookhor-source-preflight
  cancel-in-progress: false

jobs:
  read-only-preflight:
    name: Verify private source run and artifact metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRM_SHA: ${{ inputs.confirm_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::source_run_id must be numeric"; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::source_sha must be a lowercase 40-character SHA"; exit 1; }
          [[ "$CONFIRM_SHA" == "$SOURCE_SHA" ]] || { echo "::error::SHA confirmation does not match"; exit 1; }

      - name: Verify source run and expected artifact (read-only)
        env:
          GH_TOKEN: ${{ secrets.ALOOKHOR_SOURCE_READ_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo "::error::Repository secret ALOOKHOR_SOURCE_READ_TOKEN is not configured"; exit 1; }
          api="https://api.github.com/repos/hhossineyhossiney/alookhor-store"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          run_json="$(curl --fail --silent --show-error "${headers[@]}" "$api/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg sha "$SOURCE_SHA" '
            .status == "completed" and
            .conclusion == "success" and
            .event == "push" and
            .head_branch == "main" and
            .head_sha == $sha
          ' <<<"$run_json" >/dev/null || {
            echo "::error::Run must be a successful completed push on main for the exact supplied SHA."
            jq '{id, name, event, status, conclusion, head_branch, head_sha, html_url}' <<<"$run_json"
            exit 1
          }

          expected="alookhor-vps-$SOURCE_SHA"
          artifacts_json="$(curl --fail --silent --show-error "${headers[@]}" "$api/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          match_count="$(jq --arg name "$expected" '[.artifacts[] | select(.name == $name and .expired == false)] | length' <<<"$artifacts_json")"
          [[ "$match_count" == "1" ]] || {
            echo "::error::Expected exactly one non-expired artifact named $expected; found $match_count."
            jq '{artifacts: [.artifacts[] | {name, expired, size_in_bytes, created_at}]}' <<<"$artifacts_json"
            exit 1
          }

          echo "Read-only preflight passed."
          jq '{id, name, event, status, conclusion, head_branch, head_sha, html_url}' <<<"$run_json"
          jq --arg name "$expected" '{artifact: [.artifacts[] | select(.name == $name) | {name, expired, size_in_bytes, created_at}]}' <<<"$artifacts_json"
          echo "This verifies run and artifact metadata only. It does not download, inspect, sign, or deploy the artifact."
